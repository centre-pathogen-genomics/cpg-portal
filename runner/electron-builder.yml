appId: org.cpg.portal.runner
productName: CPG Runner
fileAssociations:
  # Double-clicking a downloaded tool pack opens it in this app.
  - ext: cpgpack
    name: CPG Runner tool pack
    role: Editor

directories: { output: dist, buildResources: build }
files: ["dist/electron/**/*", "package.json"]
extraResources:
  # A folder build: the executable and its libraries, copied together.
  - { from: sidecar/dist/cpg-runner, to: sidecar/cpg-runner }
  # The portal's mark, shown by the splash window while the runner starts.
  - { from: renderer/src/assets/cpg-logo.png, to: logo.png }
  # The same icon the bundle uses, for the window and the dock.
  - { from: build/icon.png, to: icon.png }
  - { from: renderer/dist, to: renderer }
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target: [{ target: dir, arch: [arm64, x64] }]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win: { icon: build/icon.png, target: [{ target: zip, arch: [x64] }] }
linux:
  { icon: build/icon.png, target: [{ target: zip, arch: [x64] }], category: Science }
asar: true
