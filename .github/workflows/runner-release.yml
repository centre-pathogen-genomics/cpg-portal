name: Runner Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-app:
    name: Build ${{ matrix.platform }} app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac-arm64
          - os: macos-13
            platform: mac-x64
          - os: windows-2022
            platform: win-x64
          - os: ubuntu-22.04
            platform: linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      - name: Install JavaScript dependencies
        run: bun ci
      - name: Build sidecar
        working-directory: runner/sidecar
        run: uv run pyinstaller cpg-runner.spec --noconfirm
      - name: Build renderer and main process
        working-directory: runner
        run: bun run build
      - name: Package macOS app
        if: startsWith(matrix.platform, 'mac-')
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash runner/scripts/build-apps.sh --skip-build ${{ matrix.platform }}
      - name: Package app
        if: ${{ !startsWith(matrix.platform, 'mac-') }}
        shell: bash
        env:
          # Optional Authenticode certificate for the Windows build; when the
          # WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD secrets are unset the exe is unsigned.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: bash runner/scripts/build-apps.sh --skip-build ${{ matrix.platform }}
      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-app-${{ matrix.platform }}
          path: runner/artifacts/apps/${{ matrix.platform }}.zip
          if-no-files-found: error

  build-runtime:
    name: Build runtime image
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Build runtime images
        run: bash runner/runtime/build.sh
      - name: Upload runtime artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-runtime
          path: |
            runner/artifacts/runtime/*.tar
            runner/artifacts/runtime/*.sha256
          if-no-files-found: error

  attach-release-assets:
    name: Attach artifacts to release
    needs:
      - build-app
      - build-runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
      - name: Upload artifacts to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-artifacts -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.sha256' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts were downloaded" >&2
            exit 1
          fi
          printf 'Uploading to %s:\n' "${TAG_NAME}"
          printf '  %s\n' "${files[@]}"
          gh release upload "${TAG_NAME}" "${files[@]}" --clobber
